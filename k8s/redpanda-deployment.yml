apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redpanda-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-deployment
  labels:
    name: redpanda-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
        name: redpanda
        imagePullPolicy: IfNotPresent
        args:
        - redpanda
        - start
        - --mode=dev-container
        - --smp=1
        - --memory=512M
        - --reserve-memory=0M
        - --overprovisioned
        - --node-id=0
        - --check=false
        - --kafka-addr=internal://0.0.0.0:9092
        - --advertise-kafka-addr=internal://redpanda:9092
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        readinessProbe:
          exec:
            command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "rpk cluster info"]
          initialDelaySeconds: 30
          periodSeconds: 15
        ports:
        - containerPort: 9092
          name: kafka
        volumeMounts:
        - name: redpanda-storage
          mountPath: /var/lib/redpanda/data
      volumes:
      - name: redpanda-storage
        persistentVolumeClaim:
          claimName: redpanda-pvc