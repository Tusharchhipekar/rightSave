# Copy to k8s/secret.yml (gitignored) and fill in real values:
#   cp k8s/secret-example.yml k8s/secret.yml
#
# Hostnames here are in-cluster DNS (postgres, redis, redpanda).
# FRONTEND_URL / AUTH_BASE_URL match the skaffold port-forwards.

apiVersion: v1
kind: Secret
metadata:
  name: database
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "rightsave"
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/rightsave"
  DATABASE_URL_READONLY: "postgresql://ml_readonly:ml_readonly@postgres:5432/rightsave"
  REDIS_URL: "redis://redis:6379"

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt
type: Opaque
stringData:
  JWT_ACCESS_SECRET: "change-me-access-secret"
  JWT_REFRESH_SECRET: "change-me-refresh-secret"

---
apiVersion: v1
kind: Secret
metadata:
  name: kafka
type: Opaque
stringData:
  KAFKA_BROKERS: "redpanda:9092"
  KAFKA_SSL: "false"

---
apiVersion: v1
kind: Secret
metadata:
  name: google
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"

---
apiVersion: v1
kind: Secret
metadata:
  name: api
type: Opaque
stringData:
  API_BACKEND_PORT: "4002"
  FRONTEND_URL: "http://localhost:3000"
  ML_WORKER_URL: "http://ml-worker"
  INTERNAL_SECRET: "change-me-internal"
  IG_VERIFY_TOKEN: "change-me-ig-verify"
  IG_APP_SECRET: "change-me-ig-app-secret"
  IG_ACCESS_TOKEN: "change-me-ig-access-token"
  MISTRAL_API_KEY: "change-me-mistral"
  MISTRAL_CHAT_MODEL: "mistral-small-latest"
  MISTRAL_EMBED_MODEL: "mistral-embed"

---
apiVersion: v1
kind: Secret
metadata:
  name: auth
type: Opaque
stringData:
  AUTH_SERVICE_PORT: "4001"
  FRONTEND_URL: "http://localhost:3000"
  AUTH_BASE_URL: "http://localhost:4001"

---
apiVersion: v1
kind: Secret
metadata:
  name: notification
type: Opaque
stringData:
  NOTIFICATION_PORT: "4003"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "your-address@gmail.com"
  SMTP_PASS: "your-16-char-app-password"
  MAIL_FROM: "Right Save <your-address@gmail.com>"
  APP_NAME: "Right Save"

---
apiVersion: v1
kind: Secret
metadata:
  name: ml
type: Opaque
stringData:
  PORT: "8000"
  INTERNAL_SECRET: "change-me-internal"
  LLM_PROVIDER: "mistral"
  CHAT_MODEL: "ministral-8b-latest"
  MISTRAL_API_KEY: "change-me-mistral"
  MISTRAL_EMBED_MODEL: "mistral-embed"
  EMBED_DIMENSIONS: "1024"
  SARVAM_API_KEY: ""
  TAVILY_API_KEY: ""
  MEM0_API_KEY: ""
  WHISPER_MODEL: "base"
  IMAGEKIT_PRIVATE_KEY: ""
  IMAGEKIT_URL_ENDPOINT: ""
  META_OEMBED_TOKEN: ""
